on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: R Code Quality Checks

jobs:
  check-style:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: '4.3.3'}
          # - {os: windows-latest, r: '4.3.3'}
          # - {os: ubuntu-latest, r: '4.3.3'}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install R code quality packages
        shell: Rscript {0}
        run: |
          # Use RSPM for faster binaries
          options(repos = c(CRAN = "https://packagemanager.rstudio.com/cran/__linux__/focal/latest"))

          # Install devtools first with dependencies
          install.packages("devtools", dependencies = TRUE)

          # Install other packages
          install.packages(c("lintr", "styler", "roxygen2"))

      - name: Run R Code Quality Checks
        shell: Rscript {0}
        run: |
          cat("::group::Session Info\n")
          print(devtools::session_info())
          cat("::endgroup::\n\n")

          cat("::group::Lintr Results\n")
          lintr::lint_dir(".", parse_settings = FALSE)
          cat("::endgroup::\n\n")

          cat("::group::Styler Changes\n")
          styler::style_dir(dry = "off")
          cat("::endgroup::\n")