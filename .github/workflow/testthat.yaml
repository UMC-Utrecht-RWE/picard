on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]
name: Testing
jobs:
  run-tests:
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [
          "ubuntu-latest",
          "macos-latest",
          "windows-latest"
          ]
        r: ["4.3.3"]
    env:
      # Speed up installs from source when unavoidable
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"
      RSPM: "https://packagemanager.posit.co/cran/__linux__/jammy/latest"
      # Parallelize testthat (auto = number of cores - 1)
      TESTTHAT_CPUS: "auto"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "${{ matrix.r }}"
          rtools: true
          # Use binaries via Posit PPM on all OSes where available
          use-public-rspm: true
          # Ensures Windows gets binary packages when possible
          http-user-agent: "release"
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev \
            pkg-config
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config gettext freetype harfbuzz fribidi cairo
      # setup-r-dependencies uses pak + cache under the hood
      - name: Install deps (incl. local package)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Cache keyed by OS + R + lockfile/DESCRIPTION hash
          cache: true
          extra-packages: |
            any::devtools
            any::testthat
            any::covr
            local::.
          needs: check
      - name: Verify installations
        shell: Rscript {0}
        run: |
          if (!base::requireNamespace("devtools", quietly = TRUE)) {
            base::stop("devtools not installed")
          }
          if (!base::requireNamespace("testthat", quietly = TRUE)) {
            base::stop("testthat not installed")
          }
          base::cat("All packages loaded successfully!\n")
      - name: Install the package (no vignettes/manual)
        shell: Rscript {0}
        run: |
          devtools::install(args = c("--no-manual",
                                     "--no-build-vignettes"),
                            upgrade = "never")
      - name: Run testthat tests (parallel)
        shell: Rscript {0}
        run: |
          devtools::test(stop_on_failure = TRUE)
      - name: Run test coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          covr::codecov()